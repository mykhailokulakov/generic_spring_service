# Problem titles (RFC 9457) — one per problem type slug.
error.not-found.title=Resource not found
error.conflict.title=Conflict
error.forbidden.title=Forbidden
error.validation.title=Validation failed
error.internal.title=Internal server error

# ErrorCode message keys.
error.example.not-found=Example {0} was not found.
error.optimistic-lock=The resource was modified by another request; reload and retry.
error.validation.failed=The request payload failed validation.
error.forbidden=You do not have permission to perform this action.
error.if-match.required=The If-Match header is required for this operation.

# Fallback message for unexpected server errors.
error.internal=An unexpected error occurred.
