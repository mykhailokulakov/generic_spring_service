# Problem titles (RFC 9457) — one per problem type slug.
error.not-found.title=Recurso no encontrado
error.conflict.title=Conflicto
error.forbidden.title=Prohibido
error.validation.title=Validación fallida
error.internal.title=Error interno del servidor

# ErrorCode message keys.
error.example.not-found=No se encontró el ejemplo {0}.
error.optimistic-lock=El recurso fue modificado por otra solicitud; recárguelo y vuelva a intentarlo.
error.validation.failed=La carga útil de la solicitud no pasó la validación.
error.forbidden=No tiene permiso para realizar esta acción.
error.if-match.required=El encabezado If-Match es obligatorio para esta operación.

# Fallback message for unexpected server errors.
error.internal=Se produjo un error inesperado.
