name: Configure Docker registry mirror
description: >
  Point Docker at mirror.gcr.io so unauthenticated Docker Hub pulls fall
  through the mirror — GitHub Actions runners share Docker Hub rate limits
  and routinely hit them. Used by both the Paketo buildpack image build and
  the Testcontainers integration job.
runs:
  using: composite
  steps:
    - name: Configure Docker registry mirror
      shell: bash
      run: |
        set -euo pipefail
        sudo mkdir -p /etc/docker
        echo '{"registry-mirrors":["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json
        sudo systemctl restart docker
        docker version
