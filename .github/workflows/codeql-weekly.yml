name: CodeQL (weekly re-scan)

# Scheduled-only CodeQL re-scan so newly-released analyzer rules pick up
# regressions on `main` even when no code change touches the affected paths.
# CodeQL also runs on every push/PR via ci.yml#security-codeql — this
# workflow is purely the time-based safety net.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-codeql:
    name: Security (CodeQL, Java)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup project Java
        uses: ./.github/actions/setup-java

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          languages: java
          queries: security-and-quality

      # Manual build — autobuild picks up annotation-processor paths
      # inconsistently across runs and occasionally produces an empty trap.
      - name: Compile main sources
        run: ./mvnw -B -ntp -DskipTests compile

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          category: /language:java
