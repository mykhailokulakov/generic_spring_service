name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Weekly CodeQL re-scan so new analyzer rules pick up regressions on main
  # even when no code change touches the affected paths.
  schedule:
    - cron: '17 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: Format (spotless:check)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Spotless check
        run: ./mvnw -q spotless:check

  build:
    name: Build (package + buildpack image)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Pushing to ghcr.io on main requires write to packages; PR runs from
      # forks won't be granted this, which is intentional — fork PRs build
      # the image and upload the tar, but skip the push step.
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # `spring-boot:build-image` runs Paketo buildpacks via Docker. Mirror
      # Docker Hub through mirror.gcr.io for the same reason the IT job does:
      # unauthenticated runners hit Docker Hub's rate limit quickly, and the
      # buildpack base layers are large.
      - name: Configure Docker registry mirror
        run: |
          sudo mkdir -p /etc/docker
          echo '{"registry-mirrors":["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker version

      # The image name is fixed (rather than ${project.version}) so the tar
      # filename is predictable and downstream jobs can reference it without
      # parsing the pom. Image is built locally only — publish=false.
      #
      # No `-q`: Paketo build output is the only way to diagnose buildpack
      # failures, and quiet mode also swallows download progress on the
      # multi-hundred-MB builder image pull.
      - name: Build container image
        env:
          IMAGE_REF: ghcr.io/mykhailokulakov/generic-spring-service:ci-${{ github.sha }}
        run: |
          ./mvnw -B -ntp -DskipTests package spring-boot:build-image \
            -Dspring-boot.build-image.publish=false \
            -Dspring-boot.build-image.imageName="${IMAGE_REF}"

      # If the `-D` override above is silently ignored by the plugin, the
      # buildpack writes the image under the pom-configured name
      # (`...:0.1.0-SNAPSHOT`). Re-tag from whatever was actually produced
      # to the canonical `ci-<sha>` ref so `docker save` has a stable input
      # regardless of which path the plugin took.
      - name: Normalize image tag
        env:
          IMAGE_REF: ghcr.io/mykhailokulakov/generic-spring-service:ci-${{ github.sha }}
        run: |
          set -euo pipefail
          docker image ls --format '{{.Repository}}:{{.Tag}}'
          if docker image inspect "${IMAGE_REF}" >/dev/null 2>&1; then
            echo "Image already tagged as ${IMAGE_REF}"
          else
            POM_VERSION="$(./mvnw -q -B -ntp help:evaluate -Dexpression=project.version -DforceStdout)"
            POM_REF="ghcr.io/mykhailokulakov/generic-spring-service:${POM_VERSION}"
            echo "Re-tagging ${POM_REF} -> ${IMAGE_REF}"
            docker tag "${POM_REF}" "${IMAGE_REF}"
          fi

      - name: Save image to tar
        env:
          IMAGE_REF: ghcr.io/mykhailokulakov/generic-spring-service:ci-${{ github.sha }}
        run: docker save "${IMAGE_REF}" -o target/app-image.tar

      - name: Upload image tar artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-image
          path: target/app-image.tar
          if-no-files-found: error
          retention-days: 7

      - name: Upload jar artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jar
          path: target/*.jar
          if-no-files-found: ignore

      # Push only on direct pushes to main — PRs (including fork PRs) just
      # validate the build. The release tag is `main-<sha>` per spec; the
      # build-time tag `ci-<sha>` is re-tagged before pushing.
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BUILD_REF: ghcr.io/mykhailokulakov/generic-spring-service:ci-${{ github.sha }}
          PUSH_REF: ghcr.io/mykhailokulakov/generic-spring-service:main-${{ github.sha }}
        run: |
          docker tag "${BUILD_REF}" "${PUSH_REF}"
          docker push "${PUSH_REF}"

  maven-enforcer:
    name: Maven Enforcer (convergence, no SNAPSHOTs on release, no dupes)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Enforce rules
        run: ./mvnw -q enforcer:enforce

  security-codeql:
    name: Security (CodeQL, Java)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # SARIF upload to the Security tab.
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@458d36d7d4f47d0dd16ca424c1d3cda0060f1360 # v3.35.5
        with:
          languages: java
          queries: security-and-quality

      # Manual build keeps CodeQL's trace step deterministic — autobuild
      # picks up annotation-processor paths inconsistently across runs.
      - name: Compile main sources
        run: ./mvnw -q -DskipTests compile

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@458d36d7d4f47d0dd16ca424c1d3cda0060f1360 # v3.35.5
        with:
          category: /language:java

  image-scan:
    name: Image scan (Trivy)
    runs-on: ubuntu-24.04
    needs: [build]
    permissions:
      contents: read
      security-events: write
      # The "Post Trivy report" step writes a sticky comment on the PR so the
      # findings are visible without downloading an artifact.
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download image tar artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: app-image
          path: image/

      - name: Load image
        id: load
        env:
          IMAGE_REF: ghcr.io/mykhailokulakov/generic-spring-service:ci-${{ github.sha }}
        run: |
          docker load -i image/app-image.tar
          docker image ls "${IMAGE_REF}"
          echo "image-ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"

      # Four Trivy invocations (the Trivy DB is cached between calls so the
      # incremental cost is small):
      #   1. SARIF for the Security tab + artifact.
      #   2. Table for human-readable artifact.
      #   3. JSON for downstream Markdown-table generation (PR comment).
      #   4. CRITICAL-only gate run with exit-code 1.
      - name: Trivy scan — SARIF report (CRITICAL,HIGH, warn-only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: ${{ steps.load.outputs.image-ref }}
          severity: 'CRITICAL,HIGH'
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'
          ignore-unfixed: true

      - name: Trivy scan — table report (CRITICAL,HIGH, warn-only)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: ${{ steps.load.outputs.image-ref }}
          severity: 'CRITICAL,HIGH'
          format: table
          output: trivy-results.txt
          exit-code: '0'
          ignore-unfixed: true

      - name: Trivy scan — JSON report (CRITICAL,HIGH, warn-only)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: ${{ steps.load.outputs.image-ref }}
          severity: 'CRITICAL,HIGH'
          format: json
          output: trivy-results.json
          exit-code: '0'
          ignore-unfixed: true

      - name: Upload Trivy reports as artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-reports
          path: |
            trivy-results.sarif
            trivy-results.txt
            trivy-results.json
          if-no-files-found: warn

      - name: Upload Trivy SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@458d36d7d4f47d0dd16ca424c1d3cda0060f1360 # v3.35.5
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image-scan

      # Sticky PR comment with a Markdown-table summary built from the JSON
      # output so reviewers (and the bot tending this PR) can see Trivy
      # findings without downloading an artifact. JSON-driven so we never
      # truncate against GitHub's body limit on per-jar listings.
      - name: Post Trivy report to PR
        if: always() && github.event_name == 'pull_request' && hashFiles('trivy-results.json') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          MARKER="<!-- trivy-image-scan-report -->"

          # Counts + Markdown rows from the JSON report.
          COUNTS="$(jq -r '
            [.Results[]? | (.Vulnerabilities // [])[] | .Severity] as $s
            | "CRITICAL=\($s|map(select(.=="CRITICAL"))|length) HIGH=\($s|map(select(.=="HIGH"))|length)"
          ' trivy-results.json)"
          eval "$COUNTS"

          if [ "${CRITICAL:-0}" -eq 0 ] && [ "${HIGH:-0}" -eq 0 ]; then
            echo "Trivy reports zero CRITICAL/HIGH findings — skipping PR comment."
            exit 0
          fi

          ROWS="$(jq -r '
            [
              .Results[]?
              | .Target as $t
              | (.Vulnerabilities // [])[]
              | "| \(.Severity) | `\(.PkgName)` | [\(.VulnerabilityID)](\(.PrimaryURL // "")) | `\(.InstalledVersion // "?")` | `\(.FixedVersion // "n/a")` | \((.Title // "") | gsub("\\|"; "/") | gsub("\n"; " ")) |"
            ]
            | sort
            | reverse
            | .[]
          ' trivy-results.json)"

          GATE_STATE="passing"
          if [ "${CRITICAL:-0}" -gt 0 ]; then GATE_STATE="failing on CRITICAL"; fi

          BODY="$(printf '%s\n## Trivy image scan — findings\n\nGate: %s. CRITICAL: **%s**, HIGH: **%s** (HIGH is advisory).\n\n| Severity | Package | CVE | Installed | Fixed | Title |\n|---|---|---|---|---|---|\n%s\n' \
            "$MARKER" "$GATE_STATE" "${CRITICAL:-0}" "${HIGH:-0}" "$ROWS")"

          # Guard against the (unlikely) case where many rows blow past the
          # 64KB comment limit: truncate body and append a footer note.
          MAX_BYTES=60000
          if [ "$(printf '%s' "$BODY" | wc -c)" -gt "$MAX_BYTES" ]; then
            BODY="$(printf '%s' "$BODY" | head -c "$MAX_BYTES")"$'\n\n_… truncated; download the `trivy-reports` artifact for the full list._'
          fi

          PAYLOAD="$(jq -n --arg body "$BODY" '{body: $body}')"
          EXISTING_ID="$(curl -sSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments?per_page=100" \
            | jq -r --arg m "$MARKER" '.[] | select(.body | startswith($m)) | .id' \
            | head -n1)"
          if [ -n "$EXISTING_ID" ]; then
            echo "Updating existing comment $EXISTING_ID"
            curl -sSL -X PATCH \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -d "$PAYLOAD" \
              "https://api.github.com/repos/$REPO/issues/comments/$EXISTING_ID" > /dev/null
          else
            echo "Creating new comment on PR #$PR_NUMBER"
            curl -sSL -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -d "$PAYLOAD" \
              "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments" > /dev/null
          fi

      - name: Trivy scan — gate (fail on CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: ${{ steps.load.outputs.image-ref }}
          severity: 'CRITICAL'
          format: table
          exit-code: '1'
          ignore-unfixed: true

  dependency-audit:
    name: Dependency audit (OWASP dependency-check)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Cache the NVD CVE database (~700MB of JSON, updated daily upstream).
      # Without this the first scan on each runner has to fetch the entire
      # feed from NVD, which is the dominant cost of this job and is heavily
      # rate-limited without an API key. Key by UTC date so the cache lasts
      # one day, then dependency-check downloads only the incremental delta.
      - name: Compute NVD cache date
        id: nvd-date
        run: echo "date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Cache NVD data
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          # Include the plugin version in the key so a plugin/schema bump
          # busts the cache automatically — old caches populated under a
          # different H2 schema can otherwise leave the DB in a half-loaded
          # state after the plugin rebuilds.
          key: nvd-${{ runner.os }}-dc12.2.2-${{ steps.nvd-date.outputs.date }}
          restore-keys: |
            nvd-${{ runner.os }}-dc12.2.2-

      # NVD_API_KEY is optional but recommended — without it the NVD download
      # is heavily rate-limited and can stretch this job over 20 minutes. Set
      # the secret on the repo to drop runtime to ~1–2 minutes. The plugin
      # reads the env var directly via <nvdApiKeyEnvironmentVariable> in
      # pom.xml; no CLI flag needed.
      #
      # No `-q`: dependency-check's NVD-download progress is logged at INFO,
      # so quiet mode makes the job look hung for 10+ minutes.
      - name: Run OWASP dependency-check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./mvnw -B -ntp org.owasp:dependency-check-maven:check

      - name: Upload HTML report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          if-no-files-found: warn

      - name: Upload SARIF report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-check-sarif
          path: target/dependency-check-report.sarif
          if-no-files-found: warn

      - name: Upload dependency-check SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@458d36d7d4f47d0dd16ca424c1d3cda0060f1360 # v3.35.5
        with:
          sarif_file: target/dependency-check-report.sarif
          category: dependency-check

  architecture:
    name: Architecture (ArchUnit)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Pure bytecode analysis: no Spring context boot, no Testcontainers, no
      # database. Surefire runs ArchitectureTest standalone so this job stays
      # well under a minute and gates the rest of CI on rule violations.
      - name: Run ArchUnit tests
        run: ./mvnw -q test -Dtest=ArchitectureTest

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: architecture-surefire-reports
          path: target/surefire-reports/*.xml
          if-no-files-found: warn

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: Architecture (ArchUnit)
          path: target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: 'false'

  unit-test:
    name: Unit tests (mvn test)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run unit tests
        run: ./mvnw -q test

      - name: Generate JaCoCo report
        if: always()
        run: ./mvnw -q jacoco:report

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: surefire-reports
          path: target/surefire-reports/*.xml
          if-no-files-found: warn

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: Unit tests
          path: target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: 'false'

      - name: Upload JaCoCo unit coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-unit
          path: target/site/jacoco/
          if-no-files-found: warn

      - name: Upload JaCoCo exec data
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jacoco-exec
          path: target/jacoco.exec
          if-no-files-found: warn

  integration-test:
    name: Integration tests (mvn verify, skip unit)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Docker is preinstalled on ubuntu-24.04 runners; Testcontainers' ryuk
      # reaper works against the default Docker socket without extra setup.
      # We configure mirror.gcr.io as a registry mirror so Docker Hub pulls
      # (postgres, testcontainers/ryuk) fall through the mirror — unauthenticated
      # Docker Hub pulls from GitHub Actions runners frequently hit the rate
      # limit, and mirror.gcr.io has no such limit for public images.
      - name: Configure Docker registry mirror
        run: |
          sudo mkdir -p /etc/docker
          echo '{"registry-mirrors":["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker version

      - name: Run integration tests
        run: ./mvnw -q verify -DskipUnitTests=true -Djacoco.check.skip=true

      - name: Upload Failsafe reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: failsafe-reports
          path: target/failsafe-reports/*.xml
          if-no-files-found: warn

      - name: Publish IT test report
        if: always()
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: Integration tests
          # Failsafe writes both per-class TEST-*.xml (JUnit format) and a
          # failsafe-summary.xml (its own schema) — the reporter can't parse
          # the summary, so we match only the per-class JUnit files.
          path: target/failsafe-reports/TEST-*.xml
          reporter: java-junit
          fail-on-error: 'false'

      - name: Upload JaCoCo integration coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-integration
          path: target/site/jacoco-it/
          if-no-files-found: warn

      - name: Upload JaCoCo IT exec data
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jacoco-it-exec
          path: target/jacoco-it.exec
          if-no-files-found: warn

  coverage-gate:
    name: Coverage gate (80%/80%)
    runs-on: ubuntu-24.04
    needs: [unit-test, integration-test]
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Download unit JaCoCo exec data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: jacoco-exec
          path: target/

      - name: Download IT JaCoCo exec data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: jacoco-it-exec
          path: target/

      - name: Download unit JaCoCo coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-unit
          path: target/site/jacoco/

      # jacoco:check / jacoco:merge / jacoco:report need target/classes to
      # evaluate against actual bytecode. Without it the bundle is empty,
      # the COVEREDRATIO limits have 0 instructions, and the gate silently
      # passes — so we rebuild classes here before running.
      - name: Compile main sources
        run: ./mvnw -q -DskipTests compile

      - name: Merge unit + IT JaCoCo exec data
        run: ./mvnw -q jacoco:merge@merge

      - name: Generate merged JaCoCo report
        run: ./mvnw -q jacoco:report -Djacoco.dataFile=target/jacoco-merged.exec

      - name: Enforce merged coverage gate (80%/80%)
        run: ./mvnw -q jacoco:check@check

      # Surface bundle coverage in the job summary instead of as a PR comment.
      - name: Write coverage summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          import os

          report = "target/site/jacoco/jacoco.xml"
          if not os.path.exists(report):
              print("## Coverage report (unit + integration)\n")
              print("_No JaCoCo report found._")
              raise SystemExit(0)

          root = ET.parse(report).getroot()
          counters = {c.get("type"): (int(c.get("missed")), int(c.get("covered")))
                      for c in root.findall("counter")}

          def fmt(t):
              m, cov = counters.get(t, (0, 0))
              total = m + cov
              pct = f"{100.0 * cov / total:.2f}%" if total else "n/a"
              return f"| {t.title()} | {cov} / {total} | {pct} |"

          print("## Coverage report (unit + integration)")
          print()
          print("Gate: 80% line, 80% branch.")
          print()
          print("| Counter | Covered / Total | Percentage |")
          print("| --- | --- | --- |")
          for t in ("INSTRUCTION", "BRANCH", "LINE", "COMPLEXITY", "METHOD", "CLASS"):
              if t in counters:
                  print(fmt(t))
          PY
